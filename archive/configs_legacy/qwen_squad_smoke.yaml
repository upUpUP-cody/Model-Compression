# Phase K smoke: Qwen2.5-1.5B-Instruct + SQuAD 2.0
# Large artifacts live under /mnt/data (see scripts/env_llm.sh).

model:
  type: qwen
  name: Qwen2.5-1.5B-Instruct
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  max_new_tokens: 64
  torch_dtype: float16

dataset:
  name: rajpurkar/squad_v2
  cache_dir: /mnt/data/datasets/squad
  validation_fraction: 0.1
  split_seed: 42
  max_seq_len: 512
  # Smoke: evaluate a capped validation subset for wall-clock.
  eval_max_samples: 64

hardware:
  device: cuda
  batch_size: 4

pruning:
  # Uniform MLP intermediate prune ratio for oneshot smoke (heads kept intact).
  oneshot_mlp_ratio: 0.25
  oneshot_head_ratio: 0.0

logging:
  output_root: /mnt/data/results/qwen_squad_smoke
  use_wandb: false

run_label: qwen_squad_smoke
seed: 42
