# Phase KG.5: Qwen2.5-1.5B + GLUE SST-2/RTE/QNLI x 1.5x/2.0x four-method small scan.
# Weights+data on /mnt/data; run artifacts on /mnt/data2.

model:
  type: qwen
  name: Qwen2.5-1.5B-Instruct
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  max_new_tokens: 8
  torch_dtype: float16

dataset:
  name: nyu-mll/glue
  # Overridden per cell by the KG.5 runner.
  task: sst2
  cache_dir: /mnt/data/datasets/glue
  validation_fraction: 0.1
  split_seed: 42
  max_seq_len: 256
  train_max_samples: 128
  validation_max_samples: 32
  eval_max_samples: 32

tasks:
  - sst2
  - rte
  - qnli

hardware:
  device: cuda
  batch_size: 1
  precision: fp16

pruning:
  # Fallback only; oneshot uses target_compression_ratio via ratios_for_stage_target.
  oneshot_mlp_ratio: 0.25
  oneshot_head_ratio: 0.0

recovery:
  level: 1
  epochs: 1
  learning_rate: 2.0e-5

controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8

search:
  max_iterations: 1
  candidate_ratios: [0.35]
  candidates_per_round: 1
  cheap_eval_samples: 2
  recovery_top_k: 1
  enable_two_layer_candidates: false
  # Overridden per target by the runner (aligned with compression target).
  max_step_compression: 2.0
  search_mlp_layers: 4

comparison:
  # Overridden per cell by the KG.5 runner.
  target_compression_ratio: 1.5
  compression_targets: [1.5, 2.0]
  iterative_stage_targets: [1.25, 1.5]
  iterative_recovery_epochs: 1
  run_task_eval: true
  methods:
    - dense
    - oneshot
    - iterative_level1
    - autonomous_search

logging:
  output_root: /mnt/data2/results/qwen_glue_kg5
  use_wandb: false

run_label: qwen_glue_kg5
seed: 42
