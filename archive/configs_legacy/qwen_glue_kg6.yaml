# Phase KG.6: budget-aligned GLUE three-task four-method rerun.
# Does not overwrite KG.5 artifacts. Oneshot recovery is on for the main table.
# Unrecovered oneshot remains a KG.5 negative control, not this matrix.

model:
  type: qwen
  name: Qwen2.5-1.5B-Instruct
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  max_new_tokens: 8
  torch_dtype: float16

dataset:
  name: nyu-mll/glue
  task: sst2
  cache_dir: /mnt/data/datasets/glue
  validation_fraction: 0.1
  split_seed: 42
  max_seq_len: 256
  train_max_samples: 512
  validation_max_samples: 128
  eval_max_samples: 128

tasks:
  - sst2
  - rte
  - qnli

hardware:
  device: cuda
  batch_size: 1
  precision: fp16

pruning:
  oneshot_mlp_ratio: 0.25
  oneshot_head_ratio: 0.0

recovery:
  level: 1
  backend: sgd
  epochs: 1
  learning_rate: 2.0e-5

controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8

search:
  max_iterations: 1
  candidate_ratios: [0.35]
  candidates_per_round: 1
  cheap_eval_samples: 4
  recovery_top_k: 1
  enable_two_layer_candidates: false
  max_step_compression: 2.0
  search_mlp_layers: 4

comparison:
  target_compression_ratio: 1.5
  compression_targets: [1.5, 2.0]
  oneshot_recovery: true
  oneshot_recovery_epochs: 1
  iterative_stage_targets: [1.25, 1.5]
  iterative_recovery_epochs: 1
  run_task_eval: true
  methods:
    - dense
    - oneshot
    - iterative_level1
    - autonomous_search

logging:
  output_root: /mnt/data2/results/qwen_glue_kg6
  summary_filename: kg6_summary.json
  use_wandb: false

run_label: qwen_glue_kg6
seed: 42
claim: "KG.6 budget-aligned GLUE scan; carved val only; not paper main table"
