model:
  type: resnet_cifar
  num_classes: 10
  base_width: 64
dataset:
  name: cifar10
  data_dir: ./data
  batch_size: 128
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  validation_fraction: 0.1
  split_seed: 42
hardware:
  device: cuda:0
  precision: fp16
  mixed_precision: true
  deterministic: true
  cudnn_benchmark: false
  tf32: false
  cpu_threads: 1
controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8
search:
  max_iterations: 1
  candidates_per_round: 1
  candidate_ratios: [0.3]
  cheap_eval_samples: 32
recovery:
  level: 1
  epochs: 3
  learning_rate: 0.001
  lora_rank: 2
  lora_alpha: 4.0
  distill_temperature: 2.0
  distill_alpha: 0.5
comparison:
  methods: [oneshot_wanda]
  target_compression_ratio: 2.0
  wanda_batches: 2
  recovery_epochs: 3
  recovery_learning_rate: 0.001
  recovery_levels: [1, 2, 3]
  report_test: true
logging:
  output_root: results/cifar_recovery_ablation_multiseed
  use_wandb: false
run_label: cifar_recovery_ablation_multiseed
seed: 42
seeds: [42, 43, 44]
