model:
  type: resnet_cifar
  num_classes: 10
  base_width: 64
dataset:
  name: cifar10
  data_dir: ./data
  batch_size: 128
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  validation_fraction: 0.1
  split_seed: 42
hardware:
  device: cuda:0
  precision: fp16
  mixed_precision: true
  deterministic: true
  cudnn_benchmark: false
  tf32: false
  cpu_threads: 1
controller:
  max_accuracy_drop_points: 2.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8
search:
  max_iterations: 3
  candidates_per_round: 2
  candidate_ratios: [0.2, 0.3]
  cheap_eval_samples: 256
  enable_two_layer_candidates: false
  recovery_top_k: 1
recovery:
  level: 1
  epochs: 3
  learning_rate: 0.001
comparison:
  methods: [dense_baseline, dense_small, oneshot_magnitude, oneshot_wanda, iterative_structured_level1, autonomous_search]
  target_compression_ratio: 2.0
  dense_small_variant: small
  oneshot_layer_ratios:
    layer1.0.conv1: 0.3
    layer2.0.conv1: 0.3
  wanda_batches: 2
  iterative_stage_ratios:
    - layer1.0.conv1: 0.2
    - layer2.0.conv1: 0.2
  recovery_epochs: 3
  recovery_learning_rate: 0.001
logging:
  output_root: results/cifar_p12_comparison_gpu
  use_wandb: false
run_label: cifar_p12_gpu_study
seed: 42
