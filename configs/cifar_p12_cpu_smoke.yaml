model:
  type: resnet_cifar
  num_classes: 10
  base_width: 16
dataset:
  name: cifar10
  data_dir: ./data
  batch_size: 32
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  validation_fraction: 0.1
  split_seed: 42
hardware:
  device: cpu
  precision: fp32
  mixed_precision: false
  deterministic: true
  cpu_threads: 1
controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8
search:
  max_iterations: 1
  candidates_per_round: 1
  candidate_ratios: [0.3]
  cheap_eval_samples: 32
  enable_two_layer_candidates: false
  recovery_top_k: 1
recovery:
  level: 1
  epochs: 0
  learning_rate: 0.001
comparison:
  methods: [dense_baseline, dense_small, oneshot_magnitude, oneshot_wanda, iterative_structured_level1, autonomous_search]
  target_compression_ratio: 1.5
  dense_small_variant: small
  wanda_batches: 1
  recovery_epochs: 0
  recovery_learning_rate: 0.001
logging:
  output_root: results/cifar_p12_comparison_cpu_smoke
  use_wandb: false
run_label: cifar_p12_cpu_smoke
seed: 42
