model:
  input_dim: 784
  hidden_dims: [512, 256, 128]
  num_classes: 10
  dropout_rate: 0.2
  use_batch_norm: true

dataset:
  name: mnist
  data_dir: ./data/mnist
  batch_size: 64
  num_workers: 0

hardware:
  device: cpu
  mixed_precision: false

controller:
  max_accuracy_drop_points: 5.0
  max_failures: 3
  min_quality_score: 0.6
  regrow_ratio_multiplier: 0.8

search:
  max_iterations: 3
  candidates_per_round: 2
  candidate_ratios: [0.3, 0.5]
  cheap_eval_samples: 500

recovery:
  level: 1
  epochs: 2
  learning_rate: 0.001

logging:
  output_root: results/autonomous_search
  use_wandb: false

seed: 42
