# Phase K6 LoRA formal small table: 1.5x/2.0x four methods, larger eval.
# Search remains single-candidate (1.5B deepcopy cost). Frozen test is post-selection.
# 4x MLP-only is not in this matrix (nominal 4x unreachable).

model:
  type: qwen
  name: Qwen2.5-1.5B-Instruct
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  max_new_tokens: 32
  torch_dtype: float16

dataset:
  name: rajpurkar/squad_v2
  cache_dir: /mnt/data/datasets/squad
  validation_fraction: 0.1
  split_seed: 42
  max_seq_len: 384
  train_max_samples: 8192
  validation_max_samples: 256
  eval_max_samples: 256
  frozen_test_max_samples: 256

hardware:
  device: cuda
  batch_size: 1
  precision: fp16

pruning:
  oneshot_mlp_ratio: 0.25
  oneshot_head_ratio: 0.0

recovery:
  level: 1
  backend: lora
  epochs: 2
  learning_rate: 1.0e-4
  weight_decay: 0.0
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8

search:
  max_iterations: 1
  candidate_ratios: [0.35]
  candidates_per_round: 1
  cheap_eval_samples: 4
  recovery_top_k: 1
  enable_two_layer_candidates: false
  max_step_compression: 2.0
  search_mlp_layers: 4

comparison:
  target_compression_ratio: 1.5
  compression_targets: [1.5, 2.0]
  oneshot_recovery: true
  oneshot_recovery_epochs: 2
  iterative_stage_targets: [1.25, 1.5]
  iterative_recovery_epochs: 2
  run_generative_eval: true
  run_frozen_test: true
  methods:
    - dense
    - oneshot
    - iterative_level1
    - autonomous_search

logging:
  output_root: /mnt/data2/results/qwen_k6_lora_formal
  summary_filename: k6_lora_formal_summary.json
  use_wandb: false

run_label: qwen_k6_lora_formal
seed: 42
claim: "K6 LoRA formal small table; single-candidate search; frozen test once after val selection"
