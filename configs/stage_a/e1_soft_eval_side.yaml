# Soft-eval side ladder (NOT Gate A / NOT formal PDF six-dim replacement)
# Re-eval Sentiment + easy variants on E1 Wanda oneshot weights (re-applied).
experiment_id: E1_soft_eval_side
model:
  path: /mnt/data/models/Qwen2.5-3B
  pdf_model: Qwen2.5-3B
  spec: formal_3B_base
  torch_dtype: float16

# Include dense=0.0 then E1 grid
sparsity_grid: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70]
recovery: none
seed: 42

e1_oneshot_checkpoint: /mnt/data2/results/E1_oneshot_sparsity_curve/e1_checkpoint.json

pruning:
  method: wanda
  wanda_batches: 4
  calibration:
    max_seq_len: 256
    train_max_samples: 128
    batch_size: 1

# Soft dims (defaults also in soft_eval_common.SOFT_DIM_SPECS; YAML may override)
soft_dimensions:
  Sentiment:
    kind: glue_sst2
    metric: classification_acc
    max_samples: 256
    max_seq_len: 256
    max_new_tokens: 8
  Math_easy:
    kind: capability
    base_dim: Math
    scan_limit: 32
    num_fewshot: 3
  Reasoning_easy:
    kind: capability
    base_dim: Reasoning
    task: bbh_fewshot_boolean_expressions_easy
    task_include_path: configs/lm_eval_tasks/easy
    scan_limit: 32
    apply_chat_template: false
    gen_kwargs:
      max_gen_toks: 32
      do_sample: false
      until:
        - "\n"
        - "Q:"
        - "Q "
        - "</s>"
        - "<|im_end|>"
        - "<|endoftext|>"
    metric_candidates:
      - exact_match,flexible-extract
      - exact_match,strict-match
      - exact_match,none
      - exact_match
  Knowledge_easy:
    kind: capability
    base_dim: Knowledge
    scan_limit: 64
    num_fewshot: 1
  Instruction_easy:
    kind: capability
    base_dim: Instruction
    scan_limit: 32
    metric_candidates:
      - prompt_level_loose_acc,none
      - prompt_level_loose_acc
      - prompt_level_strict_acc,none
      - prompt_level_strict_acc
  Code_easy:
    kind: capability
    base_dim: Code
    scan_limit: 16

evaluation:
  # Base capability block used when applying easy overrides (batch etc.)
  capability:
    mode: scan
    seed: 42
    batch_size: 16
    bootstrap_iters: 0
    scan_limits:
      PPL: 4
      Math: 64
      Knowledge: 128
      Reasoning: 64
      Instruction: 64
      Code: 32
    dimensions:
      Reasoning:
        gen_kwargs:
          max_gen_toks: 1024
          do_sample: false
  # Sentiment uses validation split from GLUE
  sentiment:
    max_samples: 256
    batch_size: 8

hardware:
  device: cuda:0
  batch_size: 16

logging:
  output_root: /mnt/data2/results/E1_soft_eval_side

dataset:
  name: nyu-mll/glue
  task: sst2
  cache_dir: /mnt/data/datasets/glue
  validation_fraction: 0.1
  split_seed: 42
