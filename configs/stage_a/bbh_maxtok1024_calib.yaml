# BBH Reasoning max_gen_toks=1024 calibration (base 3B dense, E1-aligned limits)
experiment_id: BBH1024_CALIB
model:
  path: /mnt/data/models/Qwen2.5-3B
  pdf_model: Qwen2.5-3B
  spec: formal_3B_base
  torch_dtype: float16

evaluation:
  capability:
    mode: scan
    seed: 42
    batch_size: 2
    bootstrap_iters: 0
    only_dimensions: [Reasoning]
    scan_limits:
      PPL: 4
      Math: 64
      Knowledge: 128
      Reasoning: 64
      Instruction: 64
      Code: 32
    dimensions:
      Reasoning:
        gen_kwargs:
          max_gen_toks: 1024
          do_sample: false

hardware:
  device: cuda:0
  batch_size: 2

logging:
  output_root: /mnt/data2/results/bbh_maxtok1024_calib

seed: 42
