# E1 One-shot sparsity curve — formal Qwen2.5-3B (base, NOT Instruct)
experiment_id: E1
model:
  path: /mnt/data/models/Qwen2.5-3B
  pdf_model: Qwen2.5-3B
  spec: formal_3B_base
  torch_dtype: float16

sparsity_grid: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70]
recovery: none

pruning:
  method: wanda
  wanda_batches: 4
  calibration:
    max_seq_len: 256
    train_max_samples: 128
    batch_size: 1

evaluation:
  capability:
    mode: scan
    seed: 42
    batch_size: 16
    bootstrap_iters: 0
    scan_limits:
      PPL: 4
      Math: 64
      Knowledge: 128
      Reasoning: 64
      Instruction: 64
      Code: 32
    dimensions:
      Reasoning:
        gen_kwargs:
          max_gen_toks: 1024
          do_sample: false

hardware:
  device: cuda:0
  batch_size: 16

logging:
  output_root: /mnt/data2/results/E1_oneshot_sparsity_curve

seed: 42

dataset:
  name: nyu-mll/glue
  task: sst2
  cache_dir: /mnt/data/datasets/glue
  validation_fraction: 0.1
  split_seed: 42
