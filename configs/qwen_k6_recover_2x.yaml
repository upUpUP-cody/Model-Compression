# Phase K6 recover follow-up: SQuAD 2.0x with same deeper recovery (run only if 1.5x F1 readable).

model:
  type: qwen
  name: Qwen2.5-1.5B-Instruct
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  max_new_tokens: 32
  torch_dtype: float16

dataset:
  name: rajpurkar/squad_v2
  cache_dir: /mnt/data/datasets/squad
  validation_fraction: 0.1
  split_seed: 42
  max_seq_len: 384
  train_max_samples: 512
  validation_max_samples: 64
  eval_max_samples: 64

hardware:
  device: cuda
  batch_size: 1
  precision: fp16

pruning:
  oneshot_mlp_ratio: 0.25
  oneshot_head_ratio: 0.0

recovery:
  level: 1
  epochs: 4
  learning_rate: 2.0e-5

controller:
  max_accuracy_drop_points: 100.0
  max_failures: 3
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8

search:
  max_iterations: 1
  candidate_ratios: [0.35]
  candidates_per_round: 1
  cheap_eval_samples: 4
  recovery_top_k: 1
  enable_two_layer_candidates: false
  max_step_compression: 2.0
  search_mlp_layers: 4

comparison:
  target_compression_ratio: 2.0
  compression_targets: [2.0]
  iterative_stage_targets: [1.5, 2.0]
  iterative_recovery_epochs: 4
  run_generative_eval: true
  methods:
    - dense
    - oneshot
    - iterative_level1
    - autonomous_search

logging:
  output_root: /mnt/data2/results/qwen_k6_recover_2x
  use_wandb: false

run_label: qwen_k6_recover_2x
seed: 42
