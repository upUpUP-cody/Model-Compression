# Reasoning_easy: BBH boolean fewshot with short-stop gens + flexible True/False extract.
# Avoids chat-template pollution and leading-space strict exact_match zeros.
task: bbh_fewshot_boolean_expressions_easy
dataset_path: SaylorTwift/bbh
dataset_name: boolean_expressions
output_type: generate_until
test_split: test
description: "Evaluate the result of a random Boolean expression.\n\n"
doc_to_text: "Q: {{input}}\nA:"
doc_to_target: "{{target}}"
fewshot_config:
  sampler: first_n
  samples:
    - input: not ( ( not not True ) ) is
      target: "False"
    - input: True and False and not True and True is
      target: "False"
    - input: not not ( not ( False ) ) is
      target: "True"
num_fewshot: 3
generation_kwargs:
  until:
    - "\n"
    - "Q:"
    - "Q "
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32
filter_list:
  - name: flexible-extract
    filter:
      - function: regex
        group_select: 0
        regex_pattern: "\\b(True|False)\\b"
      - function: take_first
  - name: strict-match
    filter:
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
