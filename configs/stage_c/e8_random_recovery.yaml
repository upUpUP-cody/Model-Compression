# E8 Random recovery (PDF Stage C) — resumable by cell
experiment_id: E8
model:
  path: /mnt/data/models/Qwen2.5-1.5B-Instruct
  pdf_model: Qwen2.5-3B-Instruct
  spec: proxy_1.5B
  torch_dtype: float16

child_sparsity: 0.50
pool_max_samples: 1024

# Formal matrix; override via CLI for smoke: --sizes 256 --seeds 42 --max-steps 30
data_sizes: [256, 512, 1024]
seeds: [42, 43, 44]

recovery:
  backend: lora
  max_steps: 300
  epochs: 1
  learning_rate: 1.0e-4
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  weight_decay: 0.0

evaluation:
  max_seq_len: 256
  validation_max_samples: 64
  train_max_samples: 1024

hardware:
  device: cuda:0
  batch_size: 1

logging:
  output_root: /mnt/data2/results/E8_random_recovery

dataset:
  name: nyu-mll/glue
  task: sst2
  cache_dir: /mnt/data/datasets/glue
  validation_fraction: 0.1
  split_seed: 42

resume: true
