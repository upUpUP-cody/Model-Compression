model:
  type: resnet_cifar
  num_classes: 10
  base_width: 64
dataset:
  name: cifar10
  data_dir: ./data
  batch_size: 128
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  validation_fraction: 0.1
  split_seed: 42
hardware:
  device: cuda:0
  precision: fp16
  mixed_precision: true
  deterministic: true
  cudnn_benchmark: false
  tf32: false
  cpu_threads: 1
controller:
  max_accuracy_drop_points: 2.0
  max_failures: 5
  min_quality_score: 0.0
  regrow_ratio_multiplier: 0.8
search:
  max_iterations: 12
  candidates_per_round: 2
  candidate_ratios: [0.3]
  max_step_compression: 1.75
  cheap_eval_samples: 128
  enable_two_layer_candidates: false
  recovery_top_k: 1
recovery:
  level: 1
  epochs: 2
  learning_rate: 0.001
comparison:
  target_compression_ratio: 8.0
  wanda_batches: 1
  recovery_epochs: 2
  recovery_learning_rate: 0.001
logging:
  output_root: results/cifar_crossover_path_ablation_8x
  use_wandb: false
run_label: cifar_crossover_path_ablation_8x
seed: 42
seeds: [42, 43, 44]
