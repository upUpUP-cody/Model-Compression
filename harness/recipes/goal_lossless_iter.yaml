# Iterative lossless goal: keep drop <= 1%; short layer steps; no ratio KPI.

goal:
  model:
    path: /mnt/data/models/Qwen2.5-3B
    name: Qwen2.5-3B
    dtype: bfloat16
    num_layers: 36

  hardware:
    gpu: RTX4090
    num_gpu: 1

  quality:
    mode: lossless
    max_relative_drop: 0.01
    tasks:
      - hellaswag

  compression:
    ratio_required: false
    prefer: milder_first

  search:
    auto: true
    max_trials: 6
    max_rounds: 6
    step_policy: short_layer
    stop_on_violation: revert_last_good
    plugins_order: []
    max_layers_per_step: 2
    max_sparsity_delta: 0.05
    min_weight_bits: 8

  evaluation:
    tasks:
      - hellaswag
    primary_metric: acc_norm
    limit: 64
